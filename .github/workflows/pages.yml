name: Publicar landing no GitHub Pages

on:
  push:
    branches:
      - claude/vamos-comecar-criar-vq69l3
    paths:
      - "landing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar landing
        uses: actions/upload-pages-artifact@v4
        with:
          path: landing

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
